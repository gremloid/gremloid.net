    <main id="main">
        <section class="page-header container">
            <p class="eyebrow"><a href="projects.html">← Projects</a></p>
            <h1>Connect 4</h1>
            <p class="lead">Two players, one screen. Click a column to drop a piece. The first to connect four in a row wins.</p>
        </section>

        <div class="container game">
            <p class="game-status" id="message" aria-live="polite"></p>
            <div class="board" id="board"></div>
            <button class="button" type="button" onclick="resetGame()">Reset game</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year">2026</span> Avery Johnson</p>
            <p><a href="mailto:contact@gremloid.net">contact@gremloid.net</a></p>
        </div>
    </footer>

    <script>
        const ROWS = 6, COLS = 7;
        let board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        let currentPlayer = 'red';
        let gameOver = false;

        const boardElement = document.getElementById("board");
        const messageElement = document.getElementById("message");

        // Shows the status text with a colored chip for the current player
        function setMessage(text, player) {
            messageElement.innerHTML = '';
            if (player) {
                const chip = document.createElement('span');
                chip.className = 'chip cell ' + player;
                messageElement.appendChild(chip);
            }
            messageElement.appendChild(document.createTextNode(text));
        }

        function playerName(player) {
            return player === 'red' ? 'Player 1' : 'Player 2';
        }

        function createBoard() {
            boardElement.innerHTML = "";
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement("div");
                    cell.classList.add("cell");
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener("click", () => dropPiece(col));
                    boardElement.appendChild(cell);
                }
            }
        }

        function dropPiece(col) {
            if (gameOver) return;
            for (let row = ROWS - 1; row >= 0; row--) {
                if (!board[row][col]) {
                    board[row][col] = currentPlayer;
                    updateBoard();
                    if (checkWin(row, col)) {
                        setMessage(`${playerName(currentPlayer)} wins!`, currentPlayer);
                        gameOver = true;
                    } else if (board[0].every(cell => cell)) {
                        setMessage("It's a draw!");
                        gameOver = true;
                    } else {
                        currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
                        setMessage(`${playerName(currentPlayer)}'s turn`, currentPlayer);
                    }
                    return;
                }
            }
        }

        function updateBoard() {
            document.querySelectorAll("#board .cell").forEach(cell => {
                let row = cell.dataset.row;
                let col = cell.dataset.col;
                cell.classList.remove("red", "yellow");
                if (board[row][col]) {
                    cell.classList.add(board[row][col]);
                }
            });
        }

        function checkWin(row, col) {
            return checkDirection(row, col, 1, 0) || // Vertical
                   checkDirection(row, col, 0, 1) || // Horizontal
                   checkDirection(row, col, 1, 1) || // Diagonal /
                   checkDirection(row, col, 1, -1);  // Diagonal \
        }

        function checkDirection(row, col, rowDir, colDir) {
            let count = 1;
            count += countPieces(row, col, rowDir, colDir);
            count += countPieces(row, col, -rowDir, -colDir);
            return count >= 4;
        }

        function countPieces(row, col, rowDir, colDir) {
            let count = 0;
            let r = row + rowDir;
            let c = col + colDir;
            while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === currentPlayer) {
                count++;
                r += rowDir;
                c += colDir;
            }
            return count;
        }

        function resetGame() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
            currentPlayer = 'red';
            gameOver = false;
            setMessage(`${playerName(currentPlayer)}'s turn`, currentPlayer);
            updateBoard();
        }

        createBoard();
        resetGame();
    </script>
    <script src="js/site.js?v=2"></script>
</body>
